name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate curated data
        run: node scripts/validate-data.mjs
      - name: Auto-diff reports match the committed cache (must be up to date)
        run: |
          node scripts/build-data.mjs
          test -z "$(git status --porcelain -- data/verification data/cache)" || (git status --short -- data/verification data/cache; echo "::error::run node scripts/wd.mjs enrich <dataset> && node scripts/build-data.mjs and commit" && exit 1)
      - run: npm run build
